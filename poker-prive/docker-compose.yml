# Déploiement auto-hébergé : docker compose up -d --build
# (ajoutez --profile turn pour lancer aussi le serveur TURN coturn)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: poker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poker:${POSTGRES_PASSWORD}@db:5432/poker?schema=public
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STARTING_BANKROLL: ${STARTING_BANKROLL:-100000}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      UPLOAD_DIR: /app/apps/server/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/apps/server/uploads

  # Relais TURN pour les joueurs derrière des NAT/pare-feu stricts (visio).
  turn:
    image: coturn/coturn:4.6.3
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Définissez TURN_SECRET}
      - --realm=${TURN_REALM:-poker.local}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --fingerprint
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  pgdata:
  uploads:
